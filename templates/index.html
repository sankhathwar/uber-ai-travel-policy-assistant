<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uber AI Travel Policy Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🚗 Uber AI Travel Policy Assistant</h1>

    <p class="subtitle">
        Ask questions about travel, expense, airport and approval policies.
    </p>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask a travel policy question..."
            autocomplete="off"
        >

        <button id="send-btn">
            Send
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
